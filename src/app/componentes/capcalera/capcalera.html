
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorStock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #1c1c1c;
            padding: 18px 0;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: #ff6b1a;
        }

        .navbar-nav .nav-link {
            color: #eeeeee;
            font-weight: 600;
            font-size: 14px;
            margin: 0 10px;
            transition: 0.3s;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            color: #ff6b1a;
        }

        .btn-contacto {
            background-color: #ff6b1a;
            color: white;
            padding: 11px 20px;
            border-radius: 5px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-contacto:hover {
            background-color: #e95408;
            color: white;
        }

        .navbar-toggler {
            border-color: #777;
        }

        .navbar-toggler-icon {
            filter: invert(1);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a href="#" class="logo">
                MOTOR<span>ELB.es</span>
            </a>

            
            </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
