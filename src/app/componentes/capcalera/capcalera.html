
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorStock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        
:host {
  display: block;
}

.navbar {
  background-color: #2F4F46;
  padding: 18px 0;
  font-family: Arial, sans-serif;
}

.logo {
  font-size: 27px;
  font-weight: 800;
  color: white;
  text-decoration: none;
  white-space: nowrap;
}

.logo span {
  color: #C9A77C;
}

.navbar-nav .nav-link {
  color: #E8F0EB;
  font-weight: 600;
  font-size: 14px;
  margin: 0 8px;
  transition: color 0.3s;
}

.navbar-nav .nav-link:hover,
.navbar-nav .nav-link.active {
  color: #C9A77C;
}

.btn-carrito {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: white;
  text-decoration: none;
  font-weight: 600;
  transition: color 0.3s;
}

.btn-carrito i {
  font-size: 21px;
}

.btn-carrito:hover {
  color: #C9A77C;
}

.btn-contacto {
  background-color: #C9A77C;
  color: #263D35;
  padding: 11px 18px;
  border-radius: 7px;
  font-weight: 700;
  text-decoration: none;
  transition: 0.3s;
  white-space: nowrap;
}

.btn-contacto:hover {
  background-color: #E0C6A5;
  color: #263D35;
}

.navbar-toggler {
  border-color: #A8BDB2;
}

.navbar-toggler:focus {
  box-shadow: 0 0 0 0.15rem #C9A77C80;
}

@media (max-width: 991px) {
  .navbar-nav {
    padding-top: 15px;
  }

  .navbar-nav .nav-link {
    padding: 10px 0;
  }

  .navbar-collapse .d-flex {
    padding: 12px 0 5px;
    flex-wrap: wrap;
  }
}

    </style>
</head>

<body>
    

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid px-4 px-lg-5">

    <!-- LOGO -->
    <a class="logo" href="#">
      tech<span>tap</span>
    </a>

   

   
  </div>
</nav>

</body>
